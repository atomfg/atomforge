[project]
name = "atomforge-testing"
version = "0.1.0a1"
description = "Shared pytest contracts for AtomForge plugin packages"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "atomforge-core",
    "atomforge-runtime",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
runtime = [
    "atomforge",
]
# Reference values (ModelReferenceContract).
regression = [
    "numpy",
    "pytest-regressions>=2.11",
]

[project.entry-points.pytest11]
atomforge_testing = "atomforge_testing.plugin"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "atomforge",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "numpy",
    "pytest-regressions>=2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
atomforge = { path="../..", editable=true }
atomforge_core = { path="../atomforge-core", editable=true }
atomforge_runtime = { path="../atomforge-runtime", editable=true }
