# CI for a plugin made from this template. Inside the atomforge repository this file
# is inert (GitHub only reads workflows at a repository's root); the template is
# tested there by the `test-template` job instead.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The runtime tests build the model's worker environment. Take torch from the
      # CPU-only index: the default Linux wheels bundle CUDA and are several GB.
      # The host environment is installed from uv.lock, which this does not affect.
      UV_INDEX: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Wiring
        run: uv run --no-sync pytest

      - name: Environment resolution
        run: uv run --no-sync pytest --atomforge-environment -m atomforge_environment

      - name: Runtime
        run: uv run --no-sync pytest --atomforge-runtime -m atomforge_runtime
