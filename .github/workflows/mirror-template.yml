# Mirror templates/model-plugin to atomfg/atomforge-model-plugin-template.
#
# The template is exported at the pushed commit (scripts/template/export.py), with
# its atomforge sources pinned to that commit, and committed to the mirror. The
# export itself is tested on pull requests by the test-template job.
#
# Credentials: the GitHub App atomfg-model-template-mirror (Contents and Workflows
# write, installed only on the mirror). Workflows is needed because the template ships
# a workflow file. The App's key lives in the `template-mirror` environment, which
# only `main` may use. This workflow never runs on pull requests.
name: Mirror template

on:
  push:
    branches: [main]
    paths:
      - "templates/model-plugin/**"
      - "scripts/template/**"
      - ".github/workflows/mirror-template.yml"
  workflow_dispatch:

permissions:
  contents: read

# One mirror run at a time, in push order.
concurrency:
  group: mirror-template
  cancel-in-progress: false

env:
  MIRROR: atomfg/atomforge-model-plugin-template

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: template-mirror
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Export
        run: |
          uv run --no-project python scripts/template/export.py "$RUNNER_TEMP/export" \
            --rev "$GITHUB_SHA" --repo-url "https://github.com/atomfg/atomforge"

      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.TEMPLATE_MIRROR_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_MIRROR_APP_KEY }}
          owner: atomfg
          repositories: atomforge-model-plugin-template
          permission-contents: write
          # Needed to push the template's own .github/workflows/tests.yml.
          permission-workflows: write

      - name: Commit to the mirror
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          mirror="$RUNNER_TEMP/mirror"

          # Works for the empty repository too (the first run creates main).
          git -c "http.https://github.com/.extraheader=$auth" \
            clone "https://github.com/$MIRROR.git" "$mirror"
          cd "$mirror"
          git checkout -B main

          # Replace everything but .git with the export.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/export/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Mirror is up to date."
            exit 0
          fi

          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -q -F - <<EOF
          Export the template from atomfg/atomforge@${GITHUB_SHA::12}

          Generated by scripts/template/export.py from
          https://github.com/atomfg/atomforge/tree/${GITHUB_SHA}/templates/model-plugin
          EOF
          git -c "http.https://github.com/.extraheader=$auth" push origin main
