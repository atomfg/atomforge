name: Run Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "packages/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# One group per branch or PR. A new push to a PR cancels its outdated run; runs on
# main always complete.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test-cov-core
          - test-cov-runtime
          - test-cov-builtins
          - test-cov-testing
          - test-cov-host
    name: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run tests
        run: just ${{ matrix.suite }}
