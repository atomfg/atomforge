name: Container image

# Builds containers/Dockerfile natively on linux/amd64 from this checkout, with
# atomforge and its built-in models only (no plugins), and runs the image test
# against it. The build is a separate step, so its time and the image's layer
# sizes can be read from the log; the test's own build then hits Docker's cache.

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
      - "src/**"
      - "packages/**"
      - "tests/image/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "containers/**"
      - "src/**"
      - "packages/**"
      - "tests/image/**"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    name: build and test image (ase-lj)
    env:
      ATOMFORGE_IMAGE_PLATFORM: linux/amd64
      ATOMFORGE_IMAGE_MODELS: ase-lj
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Runner resources
        run: |
          nproc
          free -h
          df -h /
          docker version --format 'docker {{.Server.Version}}'
          docker buildx version

      - name: Build image (cold)
        run: just build-image-dev linux/amd64 ase-lj --no-template

      - name: Image size
        run: |
          docker images atomforge:dev
          docker history atomforge:dev --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-120
          docker run --rm atomforge:dev atomforge env list
          df -h /

      - name: Image test
        run: uv run pytest tests/image --image -rfE --durations=10
